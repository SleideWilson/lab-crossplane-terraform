apiVersion: v1
kind: Secret
metadata:
  name: postgres-conn
  namespace: lab-dev
stringData:
  username: postgres
  password: devpassword
  endpoint: postgres.lab-dev.svc.cluster.local
  port: "5432"
---
apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: default
  namespace: lab-dev
spec:
  sslMode: disable
  credentials:
    source: PostgreSQLConnectionSecret
    connectionSecretRef:
      name: postgres-conn

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-web
  namespace: lab-dev
spec:
  podSelector:            # À QUI s'applique la règle (les pods protégés)
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress               # on filtre le trafic entrant
  ingress:
  - from:
    - podSelector:        # QUI a le droit d'entrer
        matchLabels:
          app: web
    ports:
    - protocol: TCP
      port: 5432

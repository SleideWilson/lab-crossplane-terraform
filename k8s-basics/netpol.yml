apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-web
  namespace: lab-dev
spec:
  podSelector:            # À QUI s'applique la règle (les pods protégés)
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress               # on filtre le trafic entrant
  ingress:
  - from:
    - podSelector:        # QUI a le droit d'entrer
        matchLabels:
          app: web
    - namespaceSelector:  # ET le provider Crossplane, qui vit dans un autre namespace
        matchLabels:
          kubernetes.io/metadata.name: crossplane-system
      podSelector:        # même élément de liste que namespaceSelector : les deux conditions à la fois
        matchLabels:
          pkg.crossplane.io/provider: provider-sql
    ports:
    - protocol: TCP
      port: 5432

apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: lab-dev
type: Opaque
stringData:                      # en clair ici, Kubernetes encode en base64
  POSTGRES_PASSWORD: devpassword
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lab-dev
spec:
  clusterIP: None                # headless
  selector:
    app: postgres
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: lab-dev
spec:
  serviceName: postgres               # le Service headless ci-dessus
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:18-alpine
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-auth
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql        # d'après l'étape 1
  volumeClaimTemplates:
  - metadata:
      name: data                  # doit correspondre à quoi ?
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi

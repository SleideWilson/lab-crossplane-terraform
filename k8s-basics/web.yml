# k8s-basics/web.yml
apiVersion: v1
kind: Namespace
metadata:
  name: lab-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web            # quels pods ce Deployment gère
  template:               # le modèle de pod à fabriquer
    metadata:
      labels:
        app: web          # doit correspondre à quoi ?
    spec:
      containers:
      - name: web
        image: nginx:1.29-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab-dev
spec:
  selector:
    app: web             # comment le Service trouve-t-il ses pods ?
  ports:
  - port: 80
    targetPort: 80
